# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# dotfiles-windows machine configuration  (analog of the Ubuntu setup.yml Ansible playbook)
# Applied by:   winget configure -f ~/.config/winget/setup.dsc.yaml
# Idempotent:   every WinGetPackage resource is Get/Test/Set; re-running is a no-op when in desired state.
#
# Machine-specific packages do NOT go here -- put them in the untracked
# ~/.config/winget/local.dsc.yaml (e.g. Prusa3D.PrusaSlicer), which the bridge
# script applies on top of this one.
#
# Package selection rationale is documented in the repo README appendix.

properties:
  configurationVersion: 0.2.0
  resources:

    # --- Core dev / shell -------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives: { description: Git }
      settings: { id: Git.Git, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gh
      directives: { description: GitHub CLI }
      settings: { id: GitHub.cli, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pwsh
      directives: { description: PowerShell 7 }
      settings: { id: Microsoft.PowerShell, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windowsterminal
      directives: { description: Windows Terminal }
      settings: { id: Microsoft.WindowsTerminal, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives: { description: Visual Studio Code }
      settings: { id: Microsoft.VisualStudioCode, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives: { description: Windows Subsystem for Linux }
      settings: { id: Microsoft.WSL, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powertoys
      directives: { description: PowerToys }
      settings: { id: Microsoft.PowerToys, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ohmyposh
      directives: { description: oh-my-posh prompt }
      settings: { id: JanDeDobbeleer.OhMyPosh, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ripgrep
      directives: { description: ripgrep (rg) }
      settings: { id: BurntSushi.ripgrep.MSVC, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      directives: { description: uv (Python package/tooling manager) }
      settings: { id: astral-sh.uv, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windbg
      directives: { description: WinDbg }
      settings: { id: Microsoft.WinDbg, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: imhex
      directives: { description: ImHex hex editor }
      settings: { id: WerWolv.ImHex, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pandoc
      directives: { description: Pandoc }
      settings: { id: JohnMacFarlane.Pandoc, source: winget }

    # --- AI / desktop -----------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      directives: { description: Claude desktop }
      settings: { id: Anthropic.Claude, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: sysinternals
      directives: { description: Sysinternals Suite (Store version) }
      settings: { id: 9P7KNL5RWT25, source: msstore }

    # --- Networking / remote ---------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: tailscale
      directives: { description: Tailscale }
      settings: { id: Tailscale.Tailscale, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wireshark
      directives: { description: Wireshark }
      settings: { id: WiresharkFoundation.Wireshark, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rclone
      directives: { description: rclone }
      settings: { id: Rclone.Rclone, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: winscp
      directives: { description: WinSCP }
      settings: { id: WinSCP.WinSCP, source: winget }

    # --- Diff / disk ------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: winmerge
      directives: { description: WinMerge (meld analog) }
      settings: { id: WinMerge.WinMerge, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wiztree
      directives: { description: WizTree (ncdu analog) }
      settings: { id: AntibodySoftware.WizTree, source: winget }

    # --- Files / media ----------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: teracopy
      directives: { description: TeraCopy }
      settings: { id: CodeSector.TeraCopy, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fileconverter
      directives: { description: File Converter }
      settings: { id: AdrienAllard.FileConverter, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mkvtoolnix
      directives: { description: MKVToolNix }
      settings: { id: MoritzBunkus.MKVToolNix, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vlc
      directives: { description: VLC }
      settings: { id: VideoLAN.VLC, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: handbrake
      directives: { description: HandBrake }
      settings: { id: HandBrake.HandBrake, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: acrobat
      directives: { description: Adobe Acrobat Reader (64-bit) }
      settings: { id: Adobe.Acrobat.Reader.64-bit, source: winget }

    # --- Apps -------------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: obsidian
      directives: { description: Obsidian }
      settings: { id: Obsidian.Obsidian, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: calibre
      directives: { description: calibre }
      settings: { id: calibre.calibre, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives: { description: Google Chrome }
      settings: { id: Google.Chrome.EXE, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: googledrive
      directives: { description: Google Drive }
      settings: { id: Google.GoogleDrive, source: winget }
